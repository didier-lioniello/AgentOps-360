name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.3"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Validate shell examples
        run: bash -n examples/curl/register_and_invoke.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  dependency-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Verify compiled dependencies
        env:
          CUSTOM_COMPILE_COMMAND: pip-compile --resolver=backtracking --strip-extras --output-file=requirements.txt requirements.in
        run: |
          python -m pip install "pip-tools==7.6.1"
          pip-compile --resolver=backtracking --strip-extras --output-file=requirements.txt requirements.in
          git diff --exit-code -- requirements.txt
      - name: Audit locked dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit --requirement requirements.txt --no-deps

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-lock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t agentops-360:ci .
